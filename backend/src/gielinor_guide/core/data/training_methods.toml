# Curated training methods for suggest_training.
#
# Rates come from the OSRS Wiki training guides unless the entry says otherwise
# (`approximate = true` marks rough community estimates, e.g. Slayer). Last verified against
# the Wiki: 2026-11-19. Birdhouses are deliberately excluded after the Aug 2026 XP nerf.
#
# Fields (see "Contributing training methods" in the README for the full guide)
#   id, skill, name, min_level, intensity, cost, source       required
#   kind               "hourly" (default) or "runs" (farming runs; see `tiers`)
#   xp_each            XP per action, used to count actions and owned materials
#   Rates, one of:
#     xp_per_hour      [low, high]: flat range
#     rates            [[level, typical_xp_per_hour], ...]: Wiki-style per-level table;
#                      low = typical x casual_factor (default 0.8), high = typical
#     rates_range      [[level, low, high], ...]: per-level table with explicit low/high
#   recipes            list of alternative ingredient sets per action, e.g.
#                      [{ "Ranarr potion (unf)" = 1, "Snape grass" = 1 }, { ... }]
#   tools              any-of groups of cheap items you must bring (reported, never blocking)
#   [requires]         quests (completed), quests_started (started or completed),
#                      diaries ("Region Tier"), items (any-of groups), skills, combat_level
#   [[boosts]]         { name, kind = item|diary|quest, effect, items? (all) | any_items? (any) }
#   approximate        true for rough estimates; `variance` explains what changes the rate
#   runs only:         patches, minutes_per_run, runs_per_day, tiers = [{ level, crop, xp_per_patch }]

# ======================================================================== Thieving

[[method]]
id = "fruit_stalls_hosidius"
skill = "Thieving"
name = "Fruit stalls (Hosidius)"
min_level = 25
xp_per_hour = [34_200, 42_750]
intensity = "low"
cost = "profit"
notes = "Low end is one stall, high end two stalls in the easternmost house near the beach."
