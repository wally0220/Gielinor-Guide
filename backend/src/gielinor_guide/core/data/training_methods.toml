skill = "Slayer"
name = "Low-level tasks (Turael / Spria)"
min_level = 1
xp_per_hour = [10_000, 15_000]
intensity = "medium"
cost = "cheap"
approximate = true
variance = "Low-HP monsters; mostly useful for task streaks or skipping (Turael boosting)."
notes = "No Slayer points from Turael."
source = "https://www.osrsbestinslot.com/osrs-slayer-calculator/"

[[method]]
