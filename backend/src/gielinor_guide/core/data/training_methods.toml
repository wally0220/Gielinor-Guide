  [45, 86_000, 99_000], [50, 90_000, 103_000], [55, 121_000, 136_000], [60, 126_000, 140_000],
  [65, 209_000, 230_000], [70, 218_000, 236_000], [75, 226_000, 242_000], [80, 233_000, 247_000],
  [85, 241_000, 252_000], [90, 248_000, 257_000],
]
