name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # 1. Fill in the PR description (only when a PR opens or leaves draft; never overwrites
  #    text the author wrote).
  describe:
    if: github.event.action != 'synchronize' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Claude GitHub App auth
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Claude subscription token (`claude setup-token`). For an API key instead, use:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-description --post ${{ github.repository }} ${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "Read,Write,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(git log:*),Bash(git diff:*)"

  # 2. Review. Waits for the description; still runs on pushes, when `describe` is skipped.
  review:
    needs: describe
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # A new push cancels the review of the previous one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write # Claude GitHub App auth
      actions: read # lets Claude see CI results
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Claude can use git log / blame for context
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review --post ${{ github.repository }} ${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Write,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"
